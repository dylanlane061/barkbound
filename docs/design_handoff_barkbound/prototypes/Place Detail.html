<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barkbound — Place Detail (pixel-final)</title>
<link rel="stylesheet" href="brand.css" />
<style>
  #root { min-height: 100vh; }
  .appwrap { min-height: 100vh; display: flex; flex-direction: column; }

  /* compute spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .bb-spin {
    box-sizing: border-box; display: inline-block; vertical-align: middle;
    border: 2px solid var(--line-2); border-top-color: var(--green-700);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  .ring-spin { transform-origin: 50% 50%; animation: spin 9s linear infinite; }

  .recheck-link { transition: color .14s; }
  .recheck-link:hover { color: var(--green-900) !important; text-decoration: underline; }

  /* source row reveal as it resolves */
  @keyframes compIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .comp-reveal { animation: compIn .4s cubic-bezier(0.22,1,0.36,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .bb-spin { animation-duration: 1.6s; }
    .ring-spin { animation: none; }
    .comp-reveal { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="bb-kit.jsx"></script>
<script type="text/babel" src="bb-place-final.jsx"></script>
<script type="text/babel" src="bb-place-final-app.jsx"></script>
</body>
</html>
