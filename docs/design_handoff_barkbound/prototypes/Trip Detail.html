<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barkbound — Trip Detail (pixel-final)</title>
<link rel="stylesheet" href="brand.css" />
<style>
  #root { min-height: 100vh; }
  .appwrap { min-height: 100vh; display: flex; flex-direction: column; }

  /* remove buttons reveal on row / card hover */
  .sp-x, .stop-x { opacity: 0; transition: opacity .14s, border-color .14s, background .14s; }
  .sp-row:hover .sp-x, .stop-card:hover .stop-x { opacity: 1; }
  .sp-x:hover, .stop-x:hover { border-color: var(--lo-line) !important; background: var(--lo-bg) !important; }
  @media (hover: none) { .sp-x, .stop-x { opacity: 1; } }

  /* add-stop panel entrance */
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .pop { animation: popIn .18s cubic-bezier(0.22,1,0.36,1) both; }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="bb-kit.jsx"></script>
<script type="text/babel" src="bb-trip-final.jsx"></script>
<script type="text/babel" src="bb-trip-final-app.jsx"></script>
</body>
</html>
