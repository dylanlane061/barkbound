<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barkbound — Stop Detail (pixel-final)</title>
<link rel="stylesheet" href="brand.css" />
<style>
  #root { min-height: 100vh; }
  .appwrap { min-height: 100vh; display: flex; flex-direction: column; }

  /* result card entrance (re-keyed on sort/filter change) — transform-only so a
     paused/backgrounded animation still shows content (never opacity:0) */
  @keyframes resIn { from { transform: translateY(10px); } to { transform: translateY(0); } }
  .res-card { animation: resIn .36s cubic-bezier(0.22,1,0.36,1) both; }
  .res-card:hover { transform: translateY(-2px); box-shadow: var(--sh); }
  @media (prefers-reduced-motion: reduce) { .res-card { animation: none; } }

  /* small round actions on cards */
  .rc-btn {
    width: 32px; height: 32px; border-radius: 9px; background: var(--card);
    border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: border-color .14s, background .14s, transform .1s;
  }
  .rc-btn:hover { border-color: var(--green-600); background: var(--green-tint-2); }
  .rc-btn:active { transform: scale(0.94); }
  .rc-arrow .ic { transition: transform .16s; }
  .rc-arrow:hover .ic { transform: translateX(2px); }

  /* map pin hover label */
  .pin-pop {
    position: absolute; left: 50%; bottom: calc(100% + 6px);
    background: var(--ink); color: #fff; font-size: 11.5px; font-weight: 600;
    padding: 4px 9px; border-radius: 8px; white-space: nowrap; pointer-events: none;
    box-shadow: var(--sh); transition: opacity .16s, transform .16s; z-index: 2;
  }
  .pin-pop::after { content: ''; position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    border: 4px solid transparent; border-top-color: var(--ink); }

  /* peek card entrance */
  @keyframes peekIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .peek-card { animation: peekIn .26s cubic-bezier(0.22,1,0.36,1) both; }
  @media (prefers-reduced-motion: reduce) { .peek-card { animation: none; } }

  /* popover entrance */
  @keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
  .pop { animation: popIn .18s cubic-bezier(0.22,1,0.36,1) both; transform-origin: top left; }

  /* discover search empty-state */
  .srch-opt:hover { background: var(--green-tint-2); }
  .srch-card:hover { border-color: var(--green-600) !important; box-shadow: var(--sh) !important; }

  /* range slider */
  .bb-range { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px;
    background: var(--paper-2); outline: none; cursor: pointer; }
  .bb-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--green-800); border: 3px solid #fff; box-shadow: var(--sh-sm); cursor: pointer; }
  .bb-range::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--green-800);
    border: 3px solid #fff; box-shadow: var(--sh-sm); cursor: pointer; }

  /* check engine — spinner + spinning ring arc + pulsing pin */
  @keyframes spin { to { transform: rotate(360deg); } }
  .bb-spin { box-sizing: border-box; display: inline-block; vertical-align: middle;
    border: 2px solid var(--line-2); border-top-color: var(--green-700); border-radius: 50%; animation: spin .7s linear infinite; }
  .ring-spin { transform-origin: 50% 50%; animation: spin 1.1s linear infinite; }
  @keyframes pinPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(31,138,91,0.35); } 50% { box-shadow: 0 0 0 7px rgba(31,138,91,0); } }
  .pin-pulse { animation: pinPulse 1.4s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) {
    .bb-spin { animation-duration: 1.6s; }
    .ring-spin, .pin-pulse { animation: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="bb-kit.jsx"></script>
<script type="text/babel" src="bb-stop-final.jsx"></script>
<script type="text/babel" src="bb-stop-final-app.jsx"></script>
</body>
</html>
