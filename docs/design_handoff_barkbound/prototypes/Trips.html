<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barkbound — Trips (pixel-final)</title>
<link rel="stylesheet" href="brand.css" />
<style>
  #root { min-height: 100vh; }
  .appwrap { min-height: 100vh; display: flex; flex-direction: column; }

  /* trip cover: change-photo affordance reveals on hover */
  .cover-edit { opacity: 0; transition: opacity .15s, background .15s; }
  .trip-cover:hover .cover-edit { opacity: 1; }
  .cover-edit:hover { background: #fff !important; }
  @media (hover: none) { .cover-edit { opacity: 1; } }

  @keyframes toastUp { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .toast-pop { animation: toastUp .22s cubic-bezier(0.22,1,0.36,1) both; }
  @media (prefers-reduced-motion: reduce) { .toast-pop { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="bb-kit.jsx"></script>
<script type="text/babel" src="bb-modals.jsx"></script>
<script type="text/babel" src="bb-home-final.jsx"></script>
<script type="text/babel" src="bb-home-final-app.jsx"></script>
</body>
</html>
