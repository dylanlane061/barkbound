<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Barkbound</title>
<link rel="stylesheet" href="brand.css" />
<script>
  /* Barkbound entry — route into the pixel-final experience.
     Honors any pending route saved by a previous screen, else lands on Trips. */
  (function () {
    var PAGES = { home: 'Trips.html', trip: 'Trip Detail.html', stop: 'Stop Detail.html', place: 'Place Detail.html', search: 'Stop Detail.html' };
    var dest = 'Trips.html';
    try {
      var r = JSON.parse(localStorage.getItem('bb_route') || '{}');
      if (r && r.screen && PAGES[r.screen]) dest = PAGES[r.screen];
    } catch (e) {}
    window.location.replace(dest);
  })();
</script>
<style>
  body { margin: 0; background: var(--paper); display: flex; align-items: center; justify-content: center; height: 100vh; }
  .splash { display: flex; align-items: center; gap: 12px; opacity: 0.55; }
  .mark { width: 34px; height: 34px; border-radius: 11px; background: var(--green-800); display: flex; align-items: center; justify-content: center; }
  .name { font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--green-900); letter-spacing: -0.02em; }
</style>
</head>
<body>
<div class="splash">
  <span class="mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 14c-2.2 0-4 1.6-4 3.4 0 1.3 1 2.1 2.4 2.1.8 0 1-.4 1.6-.4s.8.4 1.6.4c1.4 0 2.4-.8 2.4-2.1 0-1.8-1.8-3.4-4-3.4zM6.5 11.5a1.6 1.9 0 1 0 0-.01M17.5 11.5a1.6 1.9 0 1 0 0-.01M9.5 8a1.4 1.7 0 1 0 0-.01M14.5 8a1.4 1.7 0 1 0 0-.01"/></svg></span>
  <span class="name">Barkbound</span>
</div>
</body>
</html>
